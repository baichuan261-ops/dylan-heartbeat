name: Keep Render Services Alive

on:
  schedule:
    # 白天：每 30 分钟唤醒 heartbeat
    - cron: "*/30 0-15 * * *"

    # 晚上：每 10 分钟唤醒 heartbeat
    - cron: "*/10 16-23 * * *"

  workflow_dispatch:

jobs:
  keep-heartbeat-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake heartbeat
        run: |
          echo "Waking heartbeat service..."
          curl -fsS --max-time 30 \
            "https://lin-heartbeat.onrender.com/healthz"
          echo ""
          echo "Heartbeat responded successfully."

  keep-ntfy-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake ntfy
        run: |
          echo "Waking ntfy service..."
          curl -fsS --max-time 30 \
            "https://ntfy-service.onrender.com/"
          echo ""
          echo "ntfy responded successfully."
